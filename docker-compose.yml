version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-starter-qdrant
    ports:
      - "6333:6333"   # REST API — what our Python script talks to
      - "6334:6334"   # gRPC API — not used yet, but Qdrant exposes it by default
    volumes:
      - qdrant_storage:/qdrant/storage   # persists vectors across restarts
    restart: unless-stopped
    
# volumes section is defined at the bottom of the file to persist data across container restarts. so, if you stop and start the container, your vectors will still be there. it is standard interview point ("how do you persist data in a containerized database?")
volumes:
  qdrant_storage: